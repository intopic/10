name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --no-default-features -- -D warnings
      # Mode C (Groth16) is development only and off by default; keep it building.
      - run: cargo clippy -p evm-verifier --all-targets --features dev-groth16 -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --workspace --no-default-features --features llull-folder/cli,zeno-ivc/cli,decider-zk/cli,evm-verifier/cli
      # batch-affine-msm is on by default (and reaches the workspace builds above
      # through sdk-bindings); this checks the prover crates with the arkworks MSM.
      - name: The prover with the arkworks MSM (batch-affine-msm off)
        run: cargo test --release -p llull-folder -p zeno-ivc -p decider-zk -p evm-verifier --no-default-features --features llull-folder/cli,zeno-ivc/cli,decider-zk/cli,evm-verifier/cli,llull-folder/parallel,zeno-ivc/parallel,decider-zk/parallel,evm-verifier/parallel

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target wasm32-unknown-unknown -p core-r1cs -p llull-folder -p zeno-ivc -p decider-zk --no-default-features --lib

  wasm-sdk:
    name: "@zenollull/wasm-sdk — build + test Node.js"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/build-wasm-sdk.sh
      - name: IVC over a Circom circuit in WebAssembly, memory <= 512 MiB
        run: |
          # The package is built without a vendor key, so it checks licenses
          # against the public development key (`--dev`); a license signed
          # by any other key must be refused.
          cargo build --release -p zeno-license
          L=./target/release/zeno-license
          export ZENO_TEST_LICENSE="$($L issue --dev --customer ci --plan enterprise --days 1)"
          export ZENO_QUOTA_LICENSE="$($L issue --dev --customer ci --plan trial --days 1 --max-steps 2)"
          eval "$($L keygen)"
          export ZENO_LICENSE_PRIVATE_KEY
          export ZENO_FOREIGN_LICENSE="$($L issue --customer ci --plan enterprise --days 1)"
          node sdk/wasm/test/ivc.test.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Multi-threaded build (Web Workers) on nightly
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
          ./scripts/build-wasm-sdk-threads.sh
      - name: Multi-threaded prover in headless Chromium
        run: |
          cd sdk/wasm
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          export ZENO_TEST_LICENSE="$(../../target/release/zeno-license issue --dev --customer ci --plan enterprise --days 1)"
          node test/browser-threads.test.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: npm pack (publish-ready tarball)
        run: npm pack
        working-directory: sdk/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: zenollull-wasm-sdk
          path: sdk/wasm/zenollull-wasm-sdk-*.tgz

  contracts:
    name: ZenoLlullVerifier.sol — EVM test + gas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p evm-verifier
      - run: npm ci
        working-directory: contracts
      - name: Cache the public Powers-of-Tau file (PSE PPoT, 2^18 powers)
        id: ptau
        uses: actions/cache@v4
        with:
          path: ppot_0080_18.ptau
          key: ppot_0080_18-9693220206afab74
      - name: Download the public Powers-of-Tau file
        if: steps.ptau.outputs.cache-hit != 'true'
        run: curl -sSf --retry 3 -o ppot_0080_18.ptau https://pse-trusted-setup-ppot.s3.eu-central-1.amazonaws.com/pot28_0080/ppot_0080_18.ptau
      - name: Check the file's SHA-256
        run: echo "9693220206afab749e3d88d4ab5fdf5d36120ea102e7e587ccea0e7a5208e711  ppot_0080_18.ptau" | sha256sum -c -
      - name: Fold on-chain against the Rust prover; universal decider up to 2^16 constraints
        env:
          ZENO_PTAU: ${{ github.workspace }}/ppot_0080_18.ptau
        run: node contracts/test/verifier.test.cjs | tee -a "$GITHUB_STEP_SUMMARY"

  recursive-closing:
    name: Recursive IVC — closing circuit and finalizeRecursive over PPoT 2^20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache the public Powers-of-Tau file (PSE PPoT, 2^20 powers, 1.2 GB)
        id: ptau20
        uses: actions/cache@v4
        with:
          path: ppot_0080_20.ptau
          key: ppot_0080_20-560412532a120514
      - name: Download the public Powers-of-Tau file
        if: steps.ptau20.outputs.cache-hit != 'true'
        run: curl -sSf --retry 3 -o ppot_0080_20.ptau https://pse-trusted-setup-ppot.s3.eu-central-1.amazonaws.com/pot28_0080/ppot_0080_20.ptau
      - name: Check the file's SHA-256
        run: echo "560412532a1205145d5f21585274fb2cef61273496ddc7186aec855aab01a8cd  ppot_0080_20.ptau" | sha256sum -c -
      - name: Closing circuit (137k constraints) and the whole recursive decider, proven and verified in Rust
        env:
          ZENO_PTAU: ${{ github.workspace }}/ppot_0080_20.ptau
        run: cargo test --release -p evm-verifier --test closing_decider --test recursive -- --ignored --nocapture | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo build --release -p evm-verifier
      - run: npm ci
        working-directory: contracts
      - name: finalizeRecursive on the EVM, gas, and forged calldata
        env:
          ZENO_PTAU: ${{ github.workspace }}/ppot_0080_20.ptau
        run: node contracts/test/recursive.test.cjs | tee -a "$GITHUB_STEP_SUMMARY"

  cloud-prover:
    name: ZenoLlull-Cloud-Prover — Docker image + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker build -t zenollull-cloud-prover .
      - name: Pay-per-proof flow against the container
        run: ./scripts/smoke-cloud-prover.sh | tee -a "$GITHUB_STEP_SUMMARY"

  native-sdk:
    name: SDK native (Swift / Kotlin / Python) — UniFFI + test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./scripts/build-native-sdk.sh
      - name: IVC + succinct proof + license through the generated bindings
        run: |
          cargo build --release -p zeno-license
          L=./target/release/zeno-license
          DEV="$($L issue --dev --customer ci --plan enterprise --days 1)"
          QUOTA="$($L issue --dev --customer ci --plan trial --days 1 --max-steps 2)"
          eval "$($L keygen)"
          export ZENO_LICENSE_PRIVATE_KEY
          FOREIGN="$($L issue --customer ci --plan enterprise --days 1)"
          python3 sdk/native/test/test_sdk.py "$DEV" "$QUOTA" "$FOREIGN" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Type-check the generated Swift bindings
        run: |
          cd sdk/native/dist/swift
          swiftc -typecheck -module-name zenollull -import-objc-header zenollullFFI.h zenollull.swift
      - uses: actions/upload-artifact@v4
        with:
          name: zenollull-native-sdk
          path: sdk/native/dist

  android-aar:
    name: Android AAR (arm64-v8a, armeabi-v7a, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: ./scripts/build-android-aar.sh
      - name: The AAR contains the bindings and all three ABIs
        run: |
          AAR=sdk/android/zenollull/build/outputs/aar/zenollull-release.aar
          unzip -l "$AAR" | tee -a "$GITHUB_STEP_SUMMARY"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libzenollull.so"
          done
          unzip -l "$AAR" | grep -q classes.jar
      - uses: actions/upload-artifact@v4
        with:
          name: zenollull-android-aar
          path: sdk/android/zenollull/build/outputs/aar/*.aar

  ios-xcframework:
    name: iOS XCFramework (device + simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-ios-xcframework.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zenollull-ios-xcframework
          path: sdk/ios/dist

  kpi:
    name: KPI — fold t=100, IVC, memorie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p llull-folder -p zeno-ivc -p decider-zk
      - name: "Faza 1: fold 100 steps of a 2^16-constraint circuit (Pallas)"
        run: ./target/release/llull-folder fold --steps 100 --log-constraints 16 --curve pallas | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 1: fold 100 steps of a 2^14-constraint circuit (BN254)"
        run: ./target/release/llull-folder fold --steps 100 --log-constraints 14 --curve bn254 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 2: IVC 100 steps, Pallas/Vesta, RSS <= 512 MiB"
        run: ./target/release/zeno-ivc prove --steps 100 --log-constraints 12 --cycle pasta --max-rss-mib 512 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 2: IVC 30 steps, BN254/Grumpkin, RSS <= 512 MiB"
        run: ./target/release/zeno-ivc prove --steps 30 --log-constraints 12 --cycle bn254 --max-rss-mib 512 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 2: IVC 20 steps of a 2^16-constraint step, RSS <= 512 MiB"
        run: ./target/release/zeno-ivc prove --steps 20 --log-constraints 16 --cycle pasta --max-rss-mib 512 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 3: succinct ZK proof, Pallas/Vesta, <= 16 KiB"
        run: ./target/release/zeno-decider --steps 20 --log-constraints 12 --cycle pasta --max-proof-bytes 16384 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 3: succinct ZK proof, BN254/Grumpkin, 2^16-constraint step, <= 16 KiB"
        run: ./target/release/zeno-decider --steps 5 --log-constraints 16 --cycle bn254 --max-proof-bytes 16384 | tee -a "$GITHUB_STEP_SUMMARY"
