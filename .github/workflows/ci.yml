name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --no-default-features -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test --workspace --no-default-features --features llull-folder/cli,zeno-ivc/cli,decider-zk/cli,evm-verifier/cli

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target wasm32-unknown-unknown -p core-r1cs -p llull-folder -p zeno-ivc -p decider-zk --no-default-features --lib

  wasm-sdk:
    name: "@zenollull/wasm-sdk — build + test Node.js"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/build-wasm-sdk.sh
      - name: IVC over a Circom circuit in WebAssembly, memory <= 512 MiB
        run: |
          cargo build --release -p zeno-license
          eval "$(./target/release/zeno-license keygen)"
          export ZENO_LICENSE_PRIVATE_KEY ZENO_LICENSE_PUBLIC_KEY
          export ZENO_TEST_LICENSE="$(./target/release/zeno-license issue --customer ci --plan enterprise --days 1)"
          node sdk/wasm/test/ivc.test.cjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: npm pack (publish-ready tarball)
        run: npm pack
        working-directory: sdk/wasm
      - uses: actions/upload-artifact@v4
        with:
          name: zenollull-wasm-sdk
          path: sdk/wasm/zenollull-wasm-sdk-*.tgz

  contracts:
    name: ZenoLlullVerifier.sol — EVM test + gas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p evm-verifier
      - run: npm ci
        working-directory: contracts
      - name: Fold on-chain against the Rust prover, gas < 300k per step
        run: node contracts/test/verifier.test.cjs | tee -a "$GITHUB_STEP_SUMMARY"

  cloud-prover:
    name: ZenoLlull-Cloud-Prover — Docker image + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker build -t zenollull-cloud-prover .
      - name: Pay-per-proof flow against the container
        run: ./scripts/smoke-cloud-prover.sh | tee -a "$GITHUB_STEP_SUMMARY"

  kpi:
    name: KPI — fold t=100, IVC, memorie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p llull-folder -p zeno-ivc -p decider-zk
      - name: "Faza 1: fold 100 steps of a 2^16-constraint circuit (Pallas)"
        run: ./target/release/llull-folder fold --steps 100 --log-constraints 16 --curve pallas | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 1: fold 100 steps of a 2^14-constraint circuit (BN254)"
        run: ./target/release/llull-folder fold --steps 100 --log-constraints 14 --curve bn254 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 2: IVC 100 steps, Pallas/Vesta, RSS <= 512 MiB"
        run: ./target/release/zeno-ivc prove --steps 100 --log-constraints 12 --cycle pasta --max-rss-mib 512 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 2: IVC 30 steps, BN254/Grumpkin, RSS <= 512 MiB"
        run: ./target/release/zeno-ivc prove --steps 30 --log-constraints 12 --cycle bn254 --max-rss-mib 512 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 2: IVC 20 steps of a 2^16-constraint step, RSS <= 512 MiB"
        run: ./target/release/zeno-ivc prove --steps 20 --log-constraints 16 --cycle pasta --max-rss-mib 512 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 3: succinct ZK proof, Pallas/Vesta, <= 16 KiB"
        run: ./target/release/zeno-decider --steps 20 --log-constraints 12 --cycle pasta --max-proof-bytes 16384 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Faza 3: succinct ZK proof, BN254/Grumpkin, 2^16-constraint step, <= 16 KiB"
        run: ./target/release/zeno-decider --steps 5 --log-constraints 16 --cycle bn254 --max-proof-bytes 16384 | tee -a "$GITHUB_STEP_SUMMARY"
