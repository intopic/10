[package]
name = "cloud-prover"
description = "ZenoLlull-Cloud-Prover: pay-per-proof HTTP API with license authentication and tamper-evident usage metering"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sdk-bindings = { path = "../sdk-bindings", features = ["parallel"] }
zeno-license = { path = "../zeno-license", default-features = false }
ark-ff.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
rand.workspace = true

[dev-dependencies]
zeno-license = { path = "../zeno-license" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http-body = "1"

[[bin]]
name = "zenollull-cloud-prover"
path = "src/main.rs"
