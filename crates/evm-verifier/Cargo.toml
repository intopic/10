[package]
name = "evm-verifier"
description = "Prover-side companion of contracts/ZenoLlullVerifier.sol: Keccak transcript, calldata encoding, off-chain decider"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core-r1cs = { path = "../core-r1cs", default-features = false }
llull-folder = { path = "../llull-folder", default-features = false }
decider-zk = { path = "../decider-zk", default-features = false }
zeno-ivc = { path = "../zeno-ivc", default-features = false }
ark-grumpkin.workspace = true
ark-ff.workspace = true
ark-ec.workspace = true
ark-std.workspace = true
ark-serialize.workspace = true
ark-bn254.workspace = true
ark-relations.workspace = true
ark-crypto-primitives = { workspace = true, features = ["r1cs"] }
ark-r1cs-std.workspace = true
ark-groth16 = { version = "0.5", default-features = false, optional = true }
ark-snark = { version = "0.5", default-features = false, optional = true }
sha2.workspace = true
sha3.workspace = true

[dev-dependencies]
llull-folder = { path = "../llull-folder", default-features = false, features = ["cli"] }

[features]
# DEVELOPMENT ONLY: the Groth16 decider (mode C). Its keys are circuit-specific
# and come from a setup with a trapdoor; off by default.
dev-groth16 = ["dep:ark-groth16", "dep:ark-snark"]
default = ["parallel", "cli", "batch-affine-msm"]
# The prover's commitments with batched affine additions (llull-folder::msm).
batch-affine-msm = ["llull-folder/batch-affine-msm"]
parallel = [
    "llull-folder/parallel",
    "decider-zk/parallel",
    "zeno-ivc/parallel",
    "core-r1cs/parallel",
    "ark-groth16?/parallel",
]
cli = ["llull-folder/cli", "zeno-ivc/cli", "ark-std/std"]

[[bin]]
name = "zeno-evm-fixture"
path = "src/bin/zeno-evm-fixture.rs"
required-features = ["cli"]
