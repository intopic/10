[package]
name = "llull-folder"
description = "Zeno-Llull NIFS folding engine: Pedersen commitments, Llull cross-term T, Fiat-Shamir folding"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core-r1cs = { path = "../core-r1cs", default-features = false }
ark-ff.workspace = true
ark-ec.workspace = true
ark-std.workspace = true
ark-serialize.workspace = true
ark-crypto-primitives.workspace = true
sha2.workspace = true
rayon = { workspace = true, optional = true }
# CLI-only dependencies
ark-relations = { workspace = true, optional = true }
ark-pallas = { workspace = true, optional = true }
ark-bn254 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
ark-relations.workspace = true
ark-pallas.workspace = true
ark-vesta.workspace = true
ark-bn254.workspace = true
ark-grumpkin.workspace = true
core-r1cs = { path = "../core-r1cs" }

[features]
default = ["parallel", "cli"]
parallel = [
    "dep:rayon",
    "core-r1cs/parallel",
    "ark-ff/parallel",
    "ark-ec/parallel",
    "ark-std/parallel",
    "ark-crypto-primitives/parallel",
]
cli = [
    "core-r1cs/arkworks-bridge",
    "dep:ark-relations",
    "dep:ark-pallas",
    "dep:ark-bn254",
    "dep:rand",
    "ark-std/std",
]

[[bin]]
name = "llull-folder"
path = "src/bin/llull-folder.rs"
required-features = ["cli"]
