[package]
name = "decider-zk"
description = "Zero-knowledge finalization of a Zeno-Llull IVC proof"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core-r1cs = { path = "../core-r1cs", default-features = false }
llull-folder = { path = "../llull-folder", default-features = false }
zeno-ivc = { path = "../zeno-ivc", default-features = false }
ark-ff.workspace = true
ark-ec.workspace = true
ark-std.workspace = true
ark-serialize.workspace = true
ark-crypto-primitives.workspace = true
sha2.workspace = true
rayon = { workspace = true, optional = true }

# CLI-only dependencies
ark-pallas = { workspace = true, optional = true }
ark-vesta = { workspace = true, optional = true }
ark-bn254 = { workspace = true, optional = true }
ark-grumpkin = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
ark-pallas.workspace = true
ark-vesta.workspace = true
ark-bn254.workspace = true
ark-grumpkin.workspace = true

[features]
default = ["parallel", "cli"]
cli = [
    "dep:ark-pallas",
    "dep:ark-vesta",
    "dep:ark-bn254",
    "dep:ark-grumpkin",
    "dep:rand",
    "ark-std/std",
]
parallel = [
    "dep:rayon",
    "llull-folder/parallel",
    "zeno-ivc/parallel",
    "core-r1cs/parallel",
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-std/parallel",
]

[[bin]]
name = "zeno-decider"
path = "src/bin/zeno-decider.rs"
required-features = ["cli"]
