[workspace]
resolver = "2"
members = ["crates/core-r1cs", "crates/llull-folder", "crates/zeno-ivc", "crates/decider-zk", "crates/sdk-bindings", "crates/evm-verifier", "crates/zeno-license", "crates/mobile-ffi", "crates/zeno-evm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
repository = "https://github.com/intopic/10"

[workspace.dependencies]
ark-ff = { version = "0.5", default-features = false }
ark-ec = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false, features = ["derive"] }
ark-relations = { version = "0.5", default-features = false }
ark-r1cs-std = { version = "0.5", default-features = false }
ark-crypto-primitives = { version = "0.5", default-features = false, features = ["sponge"] }
ark-pallas = { version = "0.5", default-features = false, features = ["curve"] }
ark-vesta = { version = "0.5", default-features = false }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-grumpkin = { version = "0.5", default-features = false }
sha2 = { version = "0.10", default-features = false }
num-bigint = { version = "0.4", default-features = false }
sha3 = { version = "0.10", default-features = false }
rayon = "1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.test]
opt-level = 2
